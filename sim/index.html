<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CrossPoint Reader — Web Demo</title>
<script>
  // Enable cross-origin isolation (SharedArrayBuffer / pthreads) on static hosts
  // that can't set COOP/COEP headers. No-op when the server already isolates us
  // (e.g. Cloudflare Pages _headers), in which case crossOriginIsolated is already
  // true and no worker is registered.
  //
  // First-visit handshake: the freshly-installed worker only starts injecting the
  // isolation headers once it *controls* this document. clients.claim() in the
  // worker's activate handler grabs control of this already-open page, which fires
  // 'controllerchange' -> we reload once so the reloaded document boots isolated.
  // A guard flag makes the reload fire at most once (no reload loop).
  (function () {
    if (window.crossOriginIsolated) return;
    if (!window.isSecureContext || !('serviceWorker' in navigator)) return;
    var reloaded = false;
    function reloadOnce() { if (!reloaded) { reloaded = true; window.location.reload(); } }
    navigator.serviceWorker.addEventListener('controllerchange', reloadOnce);
    navigator.serviceWorker.register('coi-serviceworker.js').then(function (reg) {
      // Worker already active from a previous visit but this tab isn't controlled
      // (e.g. a hard navigation straight into scope): reload to pick it up.
      if (reg.active && !navigator.serviceWorker.controller) reloadOnce();
    }).catch(function () {});
  })();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: safe center; gap: 10px; padding: 8px;
    background: radial-gradient(1200px 700px at 50% -10%, #1c2027, #101216 60%);
    color: #d7dbe0; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: auto;
  }
  #title { text-align: center; line-height: 1.3; }
  #title b { font-size: 14px; font-weight: 600; color: #e7ebf0; letter-spacing: .2px; }
  #title span { font-size: 11px; color: #8b929c; }
  .controls {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 6px; flex-wrap: wrap;
  }
  .controls label { font-size: 11px; color: #8b929c; }
  select {
    background: #2c313a; color: #e7ebf0; border: 1px solid #3a414b;
    border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: inherit;
    cursor: pointer;
  }
  .controls button {
    background: #2c313a; color: #e7ebf0; border: 1px solid #3a414b;
    border-radius: 6px; padding: 4px 10px; font-size: 12px; font-family: inherit;
    cursor: pointer;
  }
  .controls button:hover { background: #353b45; }
  #note { font-size: 11px; color: #7aa2f7; }
  .device {
    position: relative; width: fit-content; padding: 8px; border-radius: 16px;
    background: #23272e; box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px #30353d;
  }
  /* The panel is a portrait e-ink frame. It is integer-scaled by JS (fitPanel)
     to the largest whole multiple of its native size that fits the window, and
     drawn with nearest-neighbour so dithered grays stay crisp. */
  canvas {
    display: block; background: #fff; border-radius: 4px;
    image-rendering: pixelated;
    box-shadow: 0 0 0 1px #000, 0 6px 20px rgba(0,0,0,.45); outline: none;
  }
  .legend {
    font-size: 12px; color: #aab0b9; display: flex; gap: 6px 16px;
    flex-wrap: wrap; justify-content: center; max-width: 96vw;
  }
  .legend b { color: #e7ebf0; font-weight: 600; }
  kbd {
    background: #2c313a; border: 1px solid #3a414b; border-radius: 4px;
    padding: 1px 6px; font-family: ui-monospace, monospace; font-size: 11px;
    color: #e7ebf0;
  }
  /* Out-of-flow so it never steals vertical space from the panel. */
  #status {
    position: fixed; left: 0; right: 0; bottom: 6px; text-align: center;
    font-size: 11px; color: #7f8792; pointer-events: none;
  }
  .spinner {
    position: absolute; top: 50%; left: 50%; margin: -16px 0 0 -16px;
    width: 32px; height: 32px; border: 3px solid #333a44; border-top-color: #7aa2f7;
    border-radius: 50%; animation: spin 1s linear infinite; display: none;
  }
  /* "Waking…" splash held over the panel across a sleep/wake page reload so the
     reader never appears to vanish while the runtime + in-memory FS re-init.
     Paper-white to match the e-ink panel (and the boot splash it reveals). */
  #wakeOverlay {
    position: absolute; inset: 8px; border-radius: 4px; z-index: 5;
    background: #f5f4ef; color: #2a2d33;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; opacity: 1; transition: opacity .4s ease;
  }
  #wakeOverlay.show { display: flex; }
  #wakeOverlay.hide { opacity: 0; }
  #wakeOverlay .wsp {
    width: 26px; height: 26px; border: 3px solid #d3d1c7; border-top-color: #6b7078;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  #wakeOverlay .wl { font-size: 14px; font-weight: 600; letter-spacing: .4px; color: #3a3f47; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="title">
    <b>CrossPoint Reader — running in your browser</b><br />
    <span>The actual e-reader firmware, compiled to WebAssembly &middot; portrait <span id="dims">&mdash;</span> &middot; read-only library &middot; networking off</span>
    <div class="controls">
      <label for="modelSel">Device</label>
      <select id="modelSel"><option>loading&hellip;</option></select>
      <button id="fsBtn" type="button" title="Toggle full screen">&#9974; Full screen</button>
      <span id="note"></span>
    </div>
  </div>
  <div class="device" id="device">
    <canvas id="canvas" width="480" height="800" tabindex="0"
            oncontextmenu="event.preventDefault()"></canvas>
    <div id="spinner" class="spinner"></div>
    <div id="wakeOverlay"><div class="wsp"></div><div class="wl">Waking&hellip;</div></div>
  </div>
  <div class="legend" id="legend"></div>
  <div id="status">preparing WebAssembly&hellip;</div>
  <script>
    var statusEl = document.getElementById('status');
    var spinnerEl = document.getElementById('spinner');
    var canvasEl = document.getElementById('canvas');

    // --- Wake bridge ----------------------------------------------------
    // A device "wake" in the web build is a full page reload (see
    // cpweb_persist_and_reload). Without this, the panel would flash blank
    // while the WASM runtime and in-memory filesystem re-initialise. If the
    // previous page set the wake flag, hold a paper "Waking…" splash over the
    // panel and drop it when the firmware paints its first frame.
    (function () {
      var ov = document.getElementById('wakeOverlay');
      var waking = false;
      try { waking = sessionStorage.getItem('cpweb_waking') === '1'; sessionStorage.removeItem('cpweb_waking'); } catch (e) {}
      if (waking && ov) ov.classList.add('show');
      var hidden = false;
      window.cpwebFirstFrame = function () {
        if (hidden || !ov) return; hidden = true;
        ov.classList.add('hide');
        setTimeout(function () { ov.classList.remove('show', 'hide'); }, 450);
      };
      // Safety net: never leave the splash stuck if boot stalls.
      if (waking) setTimeout(window.cpwebFirstFrame, 15000);
    })();

    // Integer-scale the portrait panel to the largest whole multiple that fits
    // the current window. Uses the SDL backing-store size (canvas.width/height,
    // set by the firmware's window) so it also follows runtime orientation flips.
    function fitPanel() {
      var dpr = window.devicePixelRatio || 1;
      var nativeW = Math.max(1, Math.round((canvasEl.width || 480) / dpr));
      var nativeH = Math.max(1, Math.round((canvasEl.height || 800) / dpr));
      var title = document.getElementById('title');
      var legend = document.getElementById('legend');
      // Vertical/horizontal chrome around the panel (title + legend + paddings).
      var chromeH = (title ? title.offsetHeight : 0) + (legend ? legend.offsetHeight : 0) + 56;
      var availW = window.innerWidth - 20;
      var availH = window.innerHeight - chromeH;
      var scale = Math.min(availW / nativeW, availH / nativeH);
      scale = Math.max(1, Math.floor(scale)); // integer increments, min 1x
      canvasEl.style.width = (nativeW * scale) + 'px';
      canvasEl.style.height = (nativeH * scale) + 'px';
    }
    // Recompute whenever the backing store or the window size changes.
    var lastKey = '';
    function watch() {
      var key = canvasEl.width + 'x' + canvasEl.height + '@' +
                window.innerWidth + 'x' + window.innerHeight + '@' +
                (window.devicePixelRatio || 1);
      if (key !== lastKey) { lastKey = key; fitPanel(); }
      requestAnimationFrame(watch);
    }
    window.addEventListener('resize', fitPanel);
    requestAnimationFrame(watch);

    // --- Loose-file filesystem loader -----------------------------------
    // The SD-card tree (fonts/books/dictionaries) is served as individual
    // static files listed in manifest.json, NOT baked into a .data package
    // (Cloudflare Pages caps a single asset at 25 MiB). Eager files (fonts,
    // books) are written into MEMFS before main() via an Emscripten run
    // dependency; deferred files (dictionaries) stream in the background after
    // boot and are picked up lazily when the user opens Settings.
    window.fsLoad = { eagerPct: 0, deferTotal: 0, deferDone: 0, ready: false, error: null };

    function fsWrite(path, u8) {
      var slash = path.lastIndexOf('/');
      var dir = slash > 0 ? path.substring(0, slash) : '/';
      try { Module.FS.mkdirTree(dir); } catch (e) {}
      Module.FS.writeFile(path, u8);
    }

    function fsFetch(entry) {
      var urls = entry.parts || [entry.url];   // {parts:[...]} => concatenate
      return Promise.all(urls.map(function (u) {
        return fetch(u, { cache: 'force-cache' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + u);
          return r.arrayBuffer();
        });
      })).then(function (bufs) {
        var len = bufs.reduce(function (a, b) { return a + b.byteLength; }, 0);
        var out = new Uint8Array(len), off = 0;
        bufs.forEach(function (b) { out.set(new Uint8Array(b), off); off += b.byteLength; });
        fsWrite(entry.path, out);
      });
    }

    function fsManifest() {
      return fetch('manifest.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : { files: [] }; })
        .then(function (m) { return (m && m.files) || []; });
    }

    // Eager pass: blocks main() until fonts/books are in MEMFS (fonts are
    // discovered at boot). Sequential keeps memory flat + progress monotonic.
    function fsLoadEager() {
      return fsManifest().then(function (files) {
        window.__fsAll = files;
        var eager = files.filter(function (f) { return !f.defer; });
        window.__fsDeferred = files.filter(function (f) { return f.defer; });
        var total = eager.reduce(function (a, f) { return a + (f.size || 0); }, 0) || 1;
        var loaded = 0;
        return eager.reduce(function (p, f) {
          return p.then(function () {
            return fsFetch(f).then(function () {
              loaded += (f.size || 0);
              window.fsLoad.eagerPct = Math.round(loaded / total * 100);
              if (Module.setStatus) Module.setStatus('Loading filesystem\u2026 ' + window.fsLoad.eagerPct + '%');
            });
          });
        }, Promise.resolve());
      });
    }

    // Deferred pass: runs after boot; dictionaries land while the user reads,
    // and DictionaryRegistry::discover (opened from Settings) finds them then.
    function fsLoadDeferred() {
      var d = window.__fsDeferred || [];
      window.fsLoad.deferTotal = d.length;
      if (!d.length) { window.fsLoad.ready = true; return; }
      d.reduce(function (p, f) {
        return p.then(function () { return fsFetch(f).then(function () { window.fsLoad.deferDone++; }); });
      }, Promise.resolve()).then(function () {
        window.fsLoad.ready = true;
        console.log('[fs] deferred assets ready (' + d.length + ' files)');
      }).catch(function (e) { window.fsLoad.error = String(e); console.error('[fs] deferred load failed', e); });
    }

    // --- First-visit default state (seed) -------------------------------
    // The firmware's runtime state (/.crosspoint: settings, recent list, cover
    // thumbnails) lives in IDBFS, which starts empty for a new visitor. Ship a
    // configured default (Lyra Extended theme, recents + covers, font /
    // dictionary / sleep preset) as seed.json and apply it ONCE, when IDBFS has
    // no settings.json. Returning visitors keep their own state untouched.
    function cpwebSeedIfEmpty(done) {
      var FS = Module.FS;
      var seeded = false;
      try { seeded = FS.analyzePath('/fs_/.crosspoint/settings.json').exists; } catch (e) {}
      if (seeded) { done(); return; }  // returning visitor — never overwrite
      fetch('seed.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (seed) {
          if (!seed || !seed.files) { done(); return; }
          var n = 0;
          Object.keys(seed.files).forEach(function (rel) {
            try {
              var bin = atob(seed.files[rel]);
              var u8 = new Uint8Array(bin.length);
              for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
              var path = '/fs_/.crosspoint/' + rel;
              FS.mkdirTree(path.substring(0, path.lastIndexOf('/')));
              FS.writeFile(path, u8);
              n++;
            } catch (e) { console.error('[seed] write failed: ' + rel, e); }
          });
          FS.syncfs(false, function (err) {
            if (err) console.error('[seed] persist failed', err);
            else console.log('[seed] applied default state (' + n + ' files)');
            done();
          });
        })
        .catch(function (e) { console.error('[seed] fetch failed', e); done(); });
    }

    // Emscripten reads a global `Module`. Define it before injecting <model>.js.
    window.Module = {
      canvas: (function () {
        canvasEl.addEventListener('webglcontextlost', function (e) {
          statusEl.textContent = 'Graphics context lost — reload the page.';
          e.preventDefault();
        }, false);
        return canvasEl;
      })(),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      setStatus: function (t) {
        if (!statusEl) return;
        if (t) { statusEl.textContent = t; spinnerEl.style.display = 'block'; }
        else { statusEl.textContent = ''; spinnerEl.style.display = 'none'; }
      },
      preRun: [function () {
        // Persist the firmware's runtime state tree (/.crosspoint: reading
        // position, section caches, settings) across sleep/wake page reloads via
        // IDBFS (IndexedDB). A web "wake" is a page reload, so this restores
        // state exactly as the device restores from SD after a power-wake.
        // Mounted before main() and populated (syncfs true) while a run
        // dependency holds startup. Degrades gracefully if IndexedDB is blocked.
        Module.addRunDependency('fs-idbfs');
        try {
          Module.FS.mkdirTree('/fs_/.crosspoint');
          Module.FS.mount(Module.FS.filesystems.IDBFS, {}, '/fs_/.crosspoint');
          Module.FS.syncfs(true, function (err) {
            if (err) console.error('[idbfs] initial load failed', err);
            cpwebSeedIfEmpty(function () { Module.removeRunDependency('fs-idbfs'); });
          });
        } catch (e) {
          console.error('[idbfs] mount failed (state will not persist)', e);
          Module.removeRunDependency('fs-idbfs');
        }

        // Populate MEMFS from loose static files before main() runs. The run
        // dependency holds startup until the eager (font/book) set is written.
        Module.addRunDependency('fs-loose');
        fsLoadEager().then(function () {
          Module.removeRunDependency('fs-loose');
        }).catch(function (e) {
          window.fsLoad.error = String(e);
          console.error('[fs] eager load failed', e);
          if (Module.setStatus) Module.setStatus('Filesystem load failed: ' + e.message);
          Module.removeRunDependency('fs-loose'); // boot anyway (empty FS)
        });
      }],
      onRuntimeInitialized: function () { canvasEl.focus(); fitPanel(); fsLoadDeferred(); }
    };

    // Keep keyboard focus on the panel; stop arrows/space from scrolling the page.
    // Interactive controls (the model dropdown, the fullscreen button) are
    // exempt: refocusing the canvas on their click was snapping the native
    // <select> shut, and swallowing arrow keys was blocking its navigation.
    function isControl(t) {
      return !!(t && t.closest && t.closest('select, button, a, input, label, .controls'));
    }
    window.addEventListener('click', function (e) {
      if (isControl(e.target)) return;
      canvasEl.focus();
    });
    window.addEventListener('keydown', function (e) {
      if (isControl(e.target)) return;
      if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Fullscreen toggle for the reader. Fullscreens the whole page so the
    // existing integer-scaler (fitPanel) grows the panel to fill the screen.
    // Works on desktop, Android Chrome, and iPad; hidden where the element
    // Fullscreen API is unavailable (e.g. iPhone Safari) so there's no dead button.
    (function () {
      var fsBtn = document.getElementById('fsBtn');
      if (!fsBtn) return;
      var root = document.documentElement;
      if (!(root.requestFullscreen || root.webkitRequestFullscreen)) {
        fsBtn.style.display = 'none';
        return;
      }
      function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
      fsBtn.addEventListener('click', function () {
        if (!fsEl()) {
          (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      });
      function onChange() {
        fsBtn.textContent = (fsEl() ? '⛶ Exit full screen' : '⛶ Full screen');
        fitPanel();
        canvasEl.focus();
      }
      document.addEventListener('fullscreenchange', onChange);
      document.addEventListener('webkitfullscreenchange', onChange);
    })();

    // Flush the IDBFS-backed /.crosspoint state to IndexedDB when the tab is
    // hidden or closed, so your reading position survives a plain tab close as
    // it would on the device (which writes progress to SD continuously). The
    // explicit sleep/wake path persists on its own before reloading.
    var __cpwebSyncing = false;
    function cpwebSyncState() {
      if (__cpwebSyncing || !window.Module || !Module.FS || !Module.FS.syncfs) return;
      __cpwebSyncing = true;
      try {
        Module.FS.syncfs(false, function (err) {
          __cpwebSyncing = false;
          if (err) console.error('[idbfs] background save failed', err);
        });
      } catch (e) { __cpwebSyncing = false; }
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') cpwebSyncState();
    });

    function buildLegend(model) {
      var L = document.getElementById('legend');
      var html =
        '<span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <b>navigate / turn pages</b></span>' +
        '<span><kbd>Enter</kbd> <b>select / open</b></span>' +
        '<span><kbd>Esc</kbd> <b>back</b></span>' +
        '<span><kbd>H</kbd> <b>home</b></span>' +
        '<span><kbd>P</kbd> <b>power</b></span>' +
        '<span><kbd>S</kbd> <b>sleep</b></span>';
      if (model.touch) {
        html += '<span><b style="color:#7aa2f7">Click</b> = tap &middot; <b style="color:#7aa2f7">drag</b> = swipe</span>';
      }
      L.innerHTML = html;
    }

    function buildSelector(models, current) {
      var sel = document.getElementById('modelSel');
      sel.innerHTML = models.map(function (m) {
        return '<option value="' + m.id + '"' + (m.id === current.id ? ' selected' : '') +
               '>' + m.label + (m.touch ? ' (touch)' : '') + '</option>';
      }).join('');
      sel.onchange = function () {
        var p = new URLSearchParams(location.search);
        p.set('model', sel.value);
        location.search = p.toString(); // reload with the chosen model
      };
      document.getElementById('note').textContent = current.note || '';
      document.getElementById('dims').textContent = current.w + '\u00d7' + current.h;
      document.title = 'CrossPoint Reader — ' + current.label;
    }

    // Load the model list, wire the UI, then inject the selected WASM bundle.
    fetch('models.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (models) {
        if (!models || !models.length) { throw new Error('empty'); }
        var want = new URLSearchParams(location.search).get('model');
        var model = null;
        for (var i = 0; i < models.length; i++) {
          if (models[i].id === want) { model = models[i]; break; }
        }
        if (!model) { model = models[0]; }

        buildSelector(models, model);
        buildLegend(model);
        canvasEl.width = model.w;
        canvasEl.height = model.h;
        fitPanel();

        var s = document.createElement('script');
        s.src = model.id + '.js';
        s.async = true;
        s.onerror = function () {
          statusEl.textContent = 'Failed to load ' + s.src +
            ' — run: python build.py model ' + model.id;
        };
        document.body.appendChild(s);
      })
      .catch(function () {
        statusEl.textContent =
          'No model bundles found. Build them with: python build.py all';
      });
  </script>
</body>
</html>
